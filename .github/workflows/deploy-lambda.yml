
name: Deploy Node.js Backend to AWS Lambda

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Create Lambda deployment package
      - name: Create deployment package
        run: |
          zip -r lambda.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "README.md" \
            -x ".env" \
            -x ".env.*" \
            -x "lambda.zip"

      # 5. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_dryfruits }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_dryfruits }}
          aws-region: ap-south-1

      # 6. Deploy to Lambda
      - name: Deploy code to Lambda
        run: |
          aws lambda update-function-code \
            --function-name dryfruits-backend \
            --zip-file fileb://lambda.zip
