
name: Deploy Node.js Backend to AWS Lambda

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      # Remove files not needed by Lambda
      - name: Clean unnecessary files
        run: |
          rm -rf .git .github coverage
          rm -f README.md lambda.zip
          find . -type f \( -name "*.log" -o -name "*.tsbuildinfo" \) -delete
          find node_modules -type f \( -name "*.md" -o -name "*.map" \) -delete

      - name: Create deployment package
        run: zip -r lambda.zip . \
          -x ".env" \
          -x ".env.*" \
          -x "lambda.zip"

      - name: Check deployment package size
        run: |
          ls -lh lambda.zip
          du -h lambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_dryfruits }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_dryfruits }}
          aws-region: ap-south-1

      - name: Deploy code to Lambda
        run: |
          aws lambda update-function-code \
            --function-name dryfruits-backend \
            --zip-file fileb://lambda.zip
